[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "aura"
version = "0.1.0"
description = "Autonomous Unified Research Agent"
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    "fastapi[standard]>=0.141.1",
    "pydantic>=2.13.5",
    "langgraph>=1.2.11",
    "qdrant-client>=1.19.0",
    "psycopg[binary,pool]>=3.3.5",
    "redis>=8.1.0",
    "sentence-transformers>=6.0.1",
    "transformers>=5.16.1",
    "rank-bm25>=0.2.2",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.3",
    "PyYAML>=6.0.3",
    "tenacity>=9.1.4",
    "langchain-google-genai",
    "langgraph-checkpoint-postgres", 
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.6",
    "mypy>=2.3.1",
]

[tool.setuptools.packages.find]
include = [
    "apps*",
    "agents*",
    "rag*",
    "tools*",
    "memory*",
    "evaluation*",
    "decisions*",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = true